agents:
  - name: "my_agent"
    type: "react"
    model:
      provider: "litellm"
      model_name: "groq/llama-3.1-8b-instant"
      temperature: 0.2
      max_tokens: 1000
    prompt_provider:
      inline:
        system_prompt: "You are a helpful assistant."
        user_prompt: "Answer this: {input.question}"
    max_iterations: 5
    early_stopping: true
